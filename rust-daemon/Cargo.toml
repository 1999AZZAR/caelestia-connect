[package]
name = "caelestia-connectd-rust"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dbus = "0.9"
dbus-crossroads = "0.5"
libc = "0.2"
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }
openssl = "0.10"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-openssl = "0.6"
